<title>Perguntas Frequentes sobre o Sistema de Agendamento e Gestão | Aurora Premium</title><meta name="description" content="Respostas sobre agenda online, WhatsApp, teste grátis, pagamentos e Pix, nota fiscal, migração, segurança e LGPD no Aurora Premium. Teste 14 dias grátis."><meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"><link rel="canonical" href="https://aurorapremium.com/faq/"><meta property="og:type" content="website"><meta property="og:site_name" content="Aurora Premium"><meta property="og:url" content="https://aurorapremium.com/faq/"><meta property="og:title" content="Perguntas Frequentes sobre o Sistema de Agendamento e Gestão | Aurora Premium"><meta property="og:description" content="Respostas sobre agenda online, WhatsApp, teste grátis, pagamentos e Pix, nota fiscal, migração, segurança e LGPD no Aurora Premium. Teste 14 dias grátis."><meta property="og:locale" content="pt_BR"><meta property="og:image" content="https://aurorapremium.com/img/legacy/og-aurora-premium-agendamento-gestao-T0KPS.jpg"><meta property="og:image:secure_url" content="https://aurorapremium.com/img/legacy/og-aurora-premium-agendamento-gestao-T0KPS.jpg"><meta property="og:image:type" content="image/jpeg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Aurora Premium: sistema de agendamento online e gestão para salões, barbearias e clínicas, com agenda, financeiro, estoque e comissões"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Perguntas Frequentes sobre o Sistema de Agendamento e Gestão | Aurora Premium"><meta name="twitter:description" content="Respostas sobre agenda online, WhatsApp, teste grátis, pagamentos e Pix, nota fiscal, migração, segurança e LGPD no Aurora Premium. Teste 14 dias grátis."><meta name="twitter:image" content="https://aurorapremium.com/img/legacy/og-aurora-premium-agendamento-gestao-T0KPS.jpg"><meta name="twitter:image:alt" content="Aurora Premium: sistema de agendamento online e gestão para salões, barbearias e clínicas, com agenda, financeiro, estoque e comissões"><script type="application/ld+json" data-aurora-schema="0">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Como o Aurora Premium reduz as faltas de clientes?","acceptedAnswer":{"@type":"Answer","text":"O sistema envia lembretes automáticos via WhatsApp e e-mail para o cliente confirmar o horário. Se o negócio quiser, também pode exibir a própria chave Pix na confirmação do agendamento para receber um sinal direto, sem que o Aurora processe o pagamento."}},{"@type":"Question","name":"O cliente consegue agendar sozinho pela internet?","acceptedAnswer":{"@type":"Answer","text":"Sim. Cada negócio tem uma página de agendamento e um link, com QR code, para colocar na bio do Instagram, no WhatsApp e no balcão. O cliente escolhe serviço, profissional e horário, 24 horas por dia, e o agendamento entra direto na grade."}},{"@type":"Question","name":"Funciona para salão com vários profissionais?","acceptedAnswer":{"@type":"Answer","text":"Sim! Você pode gerenciar a agenda de múltiplos profissionais simultaneamente, definir permissões de acesso e o sistema calcula automaticamente as comissões por serviço e profissional."}},{"@type":"Question","name":"Posso usar para clínica veterinária e petshop juntos?","acceptedAnswer":{"@type":"Answer","text":"Com certeza. O Aurora unifica toda a gestão: você pode ter a agenda do banho e tosa, consultas veterinárias e controle de estoque da loja em um único painel, com histórico completo por pet e tutor."}},{"@type":"Question","name":"O lembrete por WhatsApp tem custo adicional?","acceptedAnswer":{"@type":"Answer","text":"Não. O lembrete e a confirmação por WhatsApp fazem parte do Aurora Premium, sem necessidade de contratar outro serviço."}},{"@type":"Question","name":"Posso conversar com meus clientes pelo WhatsApp dentro do Aurora Premium?","acceptedAnswer":{"@type":"Answer","text":"O atendimento por conversa de WhatsApp é um complemento à parte, feito por um parceiro. Ele não é nativo do Aurora Premium e não funciona como uma ponte em tempo real com a agenda e o CRM."}},{"@type":"Question","name":"Precisa de cartão de crédito para testar?","acceptedAnswer":{"@type":"Answer","text":"Não. Você tem 14 dias totalmente gratuitos para testar todas as funcionalidades do sistema na prática, sem a necessidade de cadastrar um cartão de crédito."}},{"@type":"Question","name":"O Aurora Premium processa pagamentos? E o Pix?","acceptedAnswer":{"@type":"Answer","text":"O Aurora não processa o pagamento do seu cliente: ele continua pagando pela forma que o seu negócio já usa, como maquininha, Pix ou dinheiro. De forma opcional e configurável por estabelecimento, a chave Pix do próprio negócio aparece na confirmação do agendamento e o cliente paga o sinal direto para ela. O Aurora só registra o que foi pago e calcula a comissão de cada profissional automaticamente."}},{"@type":"Question","name":"Preciso trocar de maquininha?","acceptedAnswer":{"@type":"Answer","text":"Não. Você continua com a sua maquininha e o seu Pix, com as taxas que já negociou. O Aurora Premium registra cada pagamento."}},{"@type":"Question","name":"O Aurora Premium emite nota fiscal?","acceptedAnswer":{"@type":"Answer","text":"Não. A emissão da nota fiscal continua no sistema da prefeitura ou do seu contador."}},{"@type":"Question","name":"O sistema calcula impostos?","acceptedAnswer":{"@type":"Answer","text":"O Aurora Premium estima o imposto nos relatórios, e os relatórios exportam em PDF e Excel para facilitar o trabalho do seu contador."}},{"@type":"Question","name":"Consigo trazer os dados do sistema que uso hoje?","acceptedAnswer":{"@type":"Answer","text":"Sim. A Central de Migração traz clientes, serviços, atendimentos e profissionais, e cada migração pode ser revisada ou desfeita."}},{"@type":"Question","name":"Preciso instalar alguma coisa?","acceptedAnswer":{"@type":"Answer","text":"Não. O Aurora Premium funciona no navegador, igual no celular e no computador."}},{"@type":"Question","name":"O Aurora Premium usa inteligência artificial?","acceptedAnswer":{"@type":"Answer","text":"Sim. O módulo de Business Intelligence analisa os dados reais do seu negócio em oito áreas, como agendamentos, financeiro e clientes, e entrega insights por prioridade. Se não houver dados suficientes, o sistema informa isso em vez de gerar um resultado. Os insights são um apoio à decisão, e a palavra final é sempre sua."}},{"@type":"Question","name":"Posso gerenciar mais de uma unidade na mesma conta?","acceptedAnswer":{"@type":"Answer","text":"Sim. Você gerencia várias unidades em uma conta, com agenda, equipe, clientes, estoque e financeiro no mesmo sistema e a receita de cada unidade lado a lado. Para redes maiores, fale com a nossa equipe."}},{"@type":"Question","name":"Os dados dos meus clientes ficam seguros?","acceptedAnswer":{"@type":"Answer","text":"Os dados ficam hospedados em infraestrutura de nuvem (Supabase e AWS), com controle de acesso por perfil: cada pessoa da equipe vê apenas o que o administrador liberar."}},{"@type":"Question","name":"O Aurora Premium segue a LGPD?","acceptedAnswer":{"@type":"Answer","text":"A Política de Privacidade descreve como os dados pessoais são coletados, usados e protegidos, com base na Lei Geral de Proteção de Dados (LGPD). Você pode consultá-la na página Política de Privacidade."}}]}</script>
